# DRAFT, not applied: the engine backend in bifrost-platform-stg (step 0). It moves into bifrost-trade-infra
# k8s/overlays/platform-stg/ once the image is built by CI. No ServiceAccount of its own: the pod mounts no
# token (automountServiceAccountToken: false) and needs no Kubernetes API, so no RBAC either. No NetworkPolicy
# (the platform namespaces have none; Owner 2026-11-23 "as recommended").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-engine
  labels: { app.kubernetes.io/name: ui-engine, app.kubernetes.io/component: ui-engine }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: ui-engine } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ui-engine, app.kubernetes.io/component: ui-engine }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ui-engine
          image: registry.cicd.svc.cluster.local:5000/bifrost-engine:stg
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 8796 }]
          env:
            - { name: PLATFORM_API_URL, value: "http://platform-api:8780" }
          readinessProbe: { httpGet: { path: /engine/v1/health, port: http }, initialDelaySeconds: 2, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /engine/v1/health, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata:
  name: ui-engine
  labels: { app.kubernetes.io/name: ui-engine }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: ui-engine }
  ports: [{ name: http, port: 8796, targetPort: http }]
# The route: one PathPrefix(`/engine`) rule beside /grafana in the STG ops IngressRoute, to service ui-engine:8796.
